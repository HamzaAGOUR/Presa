  h1 { margin: 0 0 4px; font-size: 24px; }

  .x144 { width: 144px; height: 144px; }
  .x48 { width: 48px; height: 48px; }
  .label { color: #7f8ab0; font-size: 11px; margin-top: 8px; text-align: center; }
  .tiny { display: flex; gap: 14px; align-items: end; margin-top: 18px; }
