<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108" role="img" aria-labelledby="title desc">
  <title id="title">Presa launcher icon</title>
  <desc id="desc">A gold presentation remote with a dark screen and a seven-node periwinkle network on a deep navy zellige field.</desc>
  <defs>
    <linearGradient id="presaBg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080e20"/>
      <stop offset="1" stop-color="#1c2c5b"/>
    </linearGradient>
    <radialGradient id="presaGlow" cx="54" cy="45" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eab24a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#eab24a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="presaGold" x1="35" y1="24" x2="73" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd985"/>
      <stop offset=".5" stop-color="#f0b143"/>
      <stop offset="1" stop-color="#c57e0e"/>
    </linearGradient>
    <linearGradient id="presaScreen" x1="54" y1="30.5" x2="54" y2="57.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14224a"/>
      <stop offset="1" stop-color="#070d1e"/>
    </linearGradient>
    <path id="presaStar" d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2 Z"
          fill="none" stroke="#9fb0dc" stroke-opacity=".063" stroke-width=".7"/>
    <circle id="presaStarRing" r="6.2" fill="none" stroke="#9fb0dc" stroke-opacity=".039" stroke-width=".6"/>
  </defs>

  <rect width="108" height="108" fill="url(#presaBg)"/>
  <rect width="108" height="108" fill="url(#presaGlow)"/>

  <g>
    <g transform="translate(30,30)"><use href="#presaStar"/><use href="#presaStarRing"/></g>
    <g transform="translate(54,18)"><use href="#presaStar"/></g>
    <g transform="translate(78,30)"><use href="#presaStar"/><use href="#presaStarRing"/></g>
    <g transform="translate(24,54)"><use href="#presaStar"/><use href="#presaStarRing"/></g>
    <g transform="translate(84,54)"><use href="#presaStar"/><use href="#presaStarRing"/></g>
    <g transform="translate(30,78)"><use href="#presaStar"/><use href="#presaStarRing"/></g>
    <g transform="translate(54,90)"><use href="#presaStar"/></g>
    <g transform="translate(78,78)"><use href="#presaStar"/><use href="#presaStarRing"/></g>
  </g>

  <path d="M35.5,45.2 A19,19 0 0 1 73.5,45.2 V67.2 A19,19 0 0 1 35.5,67.2 Z" fill="#040915" opacity=".5"/>
  <path d="M35,43 A19,19 0 0 1 73,43 V65 A19,19 0 0 1 35,65 Z" fill="url(#presaGold)"/>
  <path d="M36.3,43 A17.7,17.7 0 0 1 71.7,43 V65 A17.7,17.7 0 0 1 36.3,65 Z" fill="none" stroke="#fff4d6" stroke-opacity=".4" stroke-width=".9"/>
  <path d="M50.5,26.8 H57.5 A.75,.75 0 0 1 57.5,28.3 H50.5 A.75,.75 0 0 1 50.5,26.8 Z" fill="#23254a" opacity=".8"/>
  <path d="M48,30.5 H60 A7,7 0 0 1 67,37.5 V50.5 A7,7 0 0 1 60,57.5 H48 A7,7 0 0 1 41,50.5 V37.5 A7,7 0 0 1 48,30.5 Z" fill="url(#presaScreen)" stroke="#8c5c0d" stroke-width=".7"/>

  <path d="M54,35 L45,43 M54,35 L63,43 M45,43 L38,51 M45,43 L50,51 M63,43 L58,51 M63,43 L70,51"
        fill="none" stroke="#152247" stroke-width="3" stroke-linecap="round"/>
  <path d="M54,35 L45,43 M54,35 L63,43 M45,43 L38,51 M45,43 L50,51 M63,43 L58,51 M63,43 L70,51"
        fill="none" stroke="#a3b8ff" stroke-width="1.6" stroke-linecap="round"/>

  <g fill="#c2cfff" stroke="#142044" stroke-width="1">
    <circle cx="54" cy="35" r="2.5"/>
    <circle cx="45" cy="43" r="2.2"/>
    <circle cx="63" cy="43" r="2.2"/>
    <circle cx="38" cy="51" r="1.9"/>
    <circle cx="50" cy="51" r="1.9"/>
    <circle cx="58" cy="51" r="1.9"/>
    <circle cx="70" cy="51" r="1.9"/>
  </g>

  <circle cx="54" cy="67" r="4.2" fill="#14224a" stroke="#8c5c0d" stroke-width=".8"/>
  <circle cx="54" cy="67" r="1.6" fill="#f6bd4e"/>
  <rect x="47.5" y="75" width="5.2" height="2.6" rx="1.3" fill="#14224a"/>
  <rect x="55.3" y="75" width="5.2" height="2.6" rx="1.3" fill="#14224a"/>
