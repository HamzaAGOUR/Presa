<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="Presa connection screen, light theme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e4eaf7"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#f0b143" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f0b143" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#2f6fe4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f6fe4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2a5c" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2a5c" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="360" height="760" fill="url(#bg)"/>
  <rect width="360" height="760" fill="url(#goldGlow)"/>
  <rect width="360" height="760" fill="url(#blueGlow)"/>

  <g filter="url(#shadow)">
    <rect x="42" y="24" width="276" height="712" rx="34" fill="#ffffff" stroke="#d6deee"/>
    <rect x="142" y="38" width="76" height="8" rx="4" fill="#e8edf9"/>

    <!-- Header -->
    <circle cx="80" cy="78" r="18" fill="#f2f5fd" stroke="#d6deee"/>
    <path d="M84 72l-6 6 6 6M78 78h13" fill="none" stroke="#59658a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2a5c">Connexion</text>
    <text x="62" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#59658a">Associez un ordinateur pour l’utiliser</text>
    <text x="62" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#59658a">comme clavier Bluetooth.</text>

    <!-- Connection status -->
    <g filter="url(#cardShadow)">
      <rect x="62" y="148" width="236" height="96" rx="16" fill="#ffffff" stroke="#d6deee"/>
    </g>
    <circle cx="76" cy="166" r="5" fill="#008a4b"/>
    <text x="90" y="164" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">Connecté</text>
    <text x="90" y="177" font-family="ui-monospace, Consolas, monospace" font-size="7" fill="#7b86a6">00:1A:7D:DA:71:13</text>
    <rect x="76" y="190" width="208" height="34" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <text x="180" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#59658a">Se déconnecter</text>

    <!-- Bonded hosts -->
    <text x="62" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#c9a227">APPAREILS ASSOCIÉS</text>
    <line x1="156" y1="269" x2="298" y2="269" stroke="#e8edf9"/>
    <rect x="62" y="284" width="236" height="96" rx="16" fill="#ffffff" stroke="#d6deee"/>
    <circle cx="88" cy="308" r="14" fill="#f2f5fd"/>
    <g transform="translate(80,300) scale(0.66)" fill="none" stroke="#59658a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="13" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </g>
    <text x="110" y="305" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1f2a5c">Surface Laptop Studio</text>
    <text x="110" y="317" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Associé · Connecté</text>
    <text x="284" y="312" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#1f2a5c">Gérer</text>
    <line x1="78" y1="332" x2="282" y2="332" stroke="#e8edf9"/>
    <circle cx="88" cy="356" r="14" fill="#f2f5fd"/>
    <g transform="translate(80,348) scale(0.66)" fill="none" stroke="#59658a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="13" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </g>
    <text x="110" y="353" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1f2a5c">MacBook Pro</text>
    <text x="110" y="365" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Associé</text>
    <text x="284" y="360" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#1f2a5c">Connecter</text>

    <!-- Nearby hosts -->
    <text x="62" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#c9a227">À PROXIMITÉ</text>
    <line x1="112" y1="405" x2="216" y2="405" stroke="#e8edf9"/>
    <rect x="226" y="390" width="72" height="27" rx="9" fill="#ffffff" stroke="#d6deee"/>
    <g transform="translate(235,396) scale(0.56)" fill="none" stroke="#59658a" stroke-width="2" stroke-linecap="round">
      <circle cx="10" cy="10" r="6"/>
      <path d="M15 15l6 6"/>
    </g>
    <text x="256" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#59658a">Rechercher</text>

    <rect x="62" y="420" width="236" height="104" rx="16" fill="#ffffff" stroke="#d6deee"/>
    <circle cx="76" cy="436" r="4" fill="none" stroke="#c9a227" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="88" y="439" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" fill="#7b86a6">Recherche en cours…</text>
    <line x1="78" y1="450" x2="282" y2="450" stroke="#e8edf9"/>
    <circle cx="88" cy="478" r="14" fill="#f2f5fd"/>
    <g transform="translate(80,470) scale(0.66)" fill="none" stroke="#59658a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="13" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </g>
    <text x="110" y="475" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1f2a5c">Atelier-PC</text>
    <text x="110" y="487" font-family="ui-monospace, Consolas, monospace" font-size="6.5" fill="#7b86a6">C8:5B:76:2A:19:04</text>
    <rect x="234" y="466" width="50" height="24" rx="8" fill="#1f2a5c"/>
    <text x="259" y="482" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#ffffff">Appairer</text>

    <!-- Tip -->
    <rect x="62" y="540" width="236" height="88" rx="16" fill="#fdf7e6" stroke="#eadca6"/>
    <g transform="translate(76,555) scale(0.7)" fill="#c9a227">
      <path d="M17.71 7.71 12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
    </g>
    <text x="96" y="568" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1f2a5c">Conseil</text>
    <text x="76" y="586" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" fill="#59658a">Gardez les réglages Bluetooth de l’ordinateur</text>
    <text x="76" y="598" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" fill="#59658a">ouverts pendant l’association. Presa apparaît</text>
    <text x="76" y="610" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" fill="#59658a">comme « Presa Keyboard ».</text>

    <rect x="148" y="708" width="64" height="4" rx="2" fill="#d6deee"/>
  </g>
</svg>
