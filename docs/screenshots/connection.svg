    <text x="98" y="187" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1f2a5c">Presa Keyboard</text>
    <text x="98" y="201" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#59658a">Connecté · Atelier-PC</text>
    <rect x="248" y="177" width="38" height="24" rx="7" fill="#ffffff" stroke="#d6deee"/>
    <text x="267" y="193" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#59658a">Gérer</text>

    <text x="62" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">DERNIER APPAREIL</text>
    <rect x="62" y="252" width="236" height="56" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <circle cx="82" cy="280" r="13" fill="#e8edf9"/>
    <text x="82" y="284" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1f2a5c">💻</text>
    <text x="102" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1f2a5c">Atelier-PC</text>
    <text x="102" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#7b86a6">00:1A:7D:DA:71:13</text>
    <rect x="234" y="266" width="52" height="26" rx="8" fill="#1f2a5c"/>
    <text x="260" y="283" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Connecter</text>

    <text x="62" y="338" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">APPAREILS ASSOCIÉS</text>
    <g font-family="Segoe UI, system-ui, sans-serif">
      <rect x="62" y="348" width="236" height="46" rx="10" fill="#ffffff" stroke="#d6deee"/>
      <text x="78" y="375" font-size="10" font-weight="600" fill="#1f2a5c">Surface Laptop Studio</text>
      <text x="284" y="375" text-anchor="end" font-size="8" fill="#7b86a6">Associé</text>
      <rect x="62" y="402" width="236" height="46" rx="10" fill="#ffffff" stroke="#d6deee"/>
      <text x="78" y="429" font-size="10" font-weight="600" fill="#1f2a5c">MacBook Pro</text>
      <text x="284" y="429" text-anchor="end" font-size="8" fill="#7b86a6">Associé</text>
    </g>

    <text x="62" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">À PROXIMITÉ</text>
    <text x="284" y="482" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#2563eb">Rechercher</text>
    <rect x="62" y="492" width="236" height="70" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <text x="180" y="520" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#7b86a6">Aucun appareil trouvé.</text>
    <text x="180" y="535" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#7b86a6">Rendez votre ordinateur visible.</text>

    <rect x="62" y="582" width="236" height="52" rx="10" fill="#fdf7e6" stroke="#eadca6"/>
    <text x="74" y="601" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1f2a5c">Conseil</text>
    <text x="74" y="616" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#59658a">Gardez les réglages Bluetooth de l’ordinateur</text>
    <text x="74" y="627" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#59658a">ouverts pendant l’association.</text>
    <text x="180" y="678" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#7b86a6">Aperçu de l’interface — capture à venir</text>
    <rect x="148" y="708" width="64" height="4" rx="2" fill="#d6deee"/>
