<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="Presa connection screen preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e8edf9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2a5c" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="360" height="760" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="24" width="276" height="712" rx="34" fill="#ffffff" stroke="#d6deee"/>
    <rect x="142" y="38" width="76" height="8" rx="4" fill="#e8edf9"/>
    <text x="62" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#7b86a6">← Retour</text>
    <text x="62" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1f2a5c">Connexion</text>
    <text x="62" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#59658a">Associez un ordinateur pour l’utiliser</text>
    <text x="62" y="149" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#59658a">comme clavier Bluetooth.</text>
    <rect x="62" y="166" width="236" height="46" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <circle cx="80" cy="189" r="8" fill="#e6f7ee"/>
