<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="Presa settings screen, light theme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e4eaf7"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#f0b143" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f0b143" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#2f6fe4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f6fe4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2a5c" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1f2a5c" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="360" height="760" fill="url(#bg)"/>
  <rect width="360" height="760" fill="url(#goldGlow)"/>
  <rect width="360" height="760" fill="url(#blueGlow)"/>

  <g filter="url(#shadow)">
    <rect x="42" y="24" width="276" height="712" rx="34" fill="#ffffff" stroke="#d6deee"/>
    <rect x="142" y="38" width="76" height="8" rx="4" fill="#e8edf9"/>

    <!-- Header -->
    <circle cx="80" cy="78" r="18" fill="#f2f5fd" stroke="#d6deee"/>
    <path d="M84 72l-6 6 6 6M78 78h13" fill="none" stroke="#59658a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1f2a5c">Paramètres</text>

    <!-- Appearance -->
    <g filter="url(#cardShadow)">
      <rect x="62" y="112" width="236" height="150" rx="16" fill="#ffffff" stroke="#d6deee"/>
    </g>
    <text x="76" y="134" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#c9a227">APPARENCE</text>
    <line x1="137" y1="131" x2="284" y2="131" stroke="#e8edf9"/>
    <text x="76" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Thème</text>
    <rect x="76" y="166" width="208" height="32" rx="16" fill="#f2f5fd" stroke="#d6deee"/>
    <rect x="79" y="169" width="67" height="26" rx="13" fill="#1f2a5c"/>
    <text x="112.5" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Système</text>
    <text x="180" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#59658a">Clair</text>
    <text x="248" y="186" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#59658a">Sombre</text>
    <text x="76" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Langue</text>
    <rect x="76" y="226" width="208" height="32" rx="16" fill="#f2f5fd" stroke="#d6deee"/>
    <rect x="79" y="229" width="101" height="26" rx="13" fill="#1f2a5c"/>
    <text x="129.5" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Français</text>
    <text x="241" y="246" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#59658a">English</text>

    <!-- Controls -->
    <g filter="url(#cardShadow)">
      <rect x="62" y="274" width="236" height="180" rx="16" fill="#ffffff" stroke="#d6deee"/>
    </g>
    <text x="76" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#c9a227">COMMANDES</text>
    <line x1="145" y1="293" x2="284" y2="293" stroke="#e8edf9"/>
    <text x="76" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Retour haptique</text>
    <text x="76" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Une vibration à chaque pression.</text>
    <rect x="260" y="310" width="24" height="14" rx="7" fill="#008a4b"/>
    <circle cx="277" cy="317" r="5" fill="#ffffff"/>
    <line x1="76" y1="340" x2="284" y2="340" stroke="#e8edf9"/>
    <text x="76" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Volume = suivant / précédent</text>
    <text x="76" y="372" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Les boutons de volume pilotent les diapositives.</text>
    <rect x="260" y="354" width="24" height="14" rx="7" fill="#d6deee"/>
    <circle cx="267" cy="361" r="5" fill="#ffffff"/>
    <text x="76" y="396" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Vitesse de répétition</text>
    <rect x="76" y="404" width="208" height="32" rx="16" fill="#f2f5fd" stroke="#d6deee"/>
    <rect x="150" y="407" width="66" height="26" rx="13" fill="#1f2a5c"/>
    <text x="112" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#59658a">Lent</text>
    <text x="183" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff">Normal</text>
    <text x="250" y="424" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#59658a">Rapide</text>

    <!-- Timer -->
    <g filter="url(#cardShadow)">
      <rect x="62" y="466" width="236" height="72" rx="16" fill="#ffffff" stroke="#d6deee"/>
    </g>
    <text x="76" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#c9a227">MINUTEUR</text>
    <line x1="125" y1="485" x2="284" y2="485" stroke="#e8edf9"/>
    <text x="76" y="510" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Alerte de fin de minuteur</text>
    <text x="76" y="522" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Vibre après le nombre de minutes choisi.</text>
    <circle cx="214" cy="507" r="11" fill="#f2f5fd" stroke="#d6deee"/>
    <path d="M210 507h8" stroke="#59658a" stroke-width="1.5" stroke-linecap="round"/>
    <text x="242" y="511" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="9" font-weight="700" fill="#1f2a5c">30 min</text>
    <circle cx="278" cy="507" r="11" fill="#f2f5fd" stroke="#d6deee"/>
    <path d="M274 507h8M278 503v8" stroke="#59658a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Key remapping -->
    <g filter="url(#cardShadow)">
      <rect x="62" y="550" width="236" height="58" rx="16" fill="#ffffff" stroke="#d6deee"/>
    </g>
    <g transform="translate(76,568) scale(0.72)" fill="none" stroke="#c9a227" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>
      <path d="M13.5 6.5l3 3"/>
    </g>
    <text x="98" y="572" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#1f2a5c">Remapper les touches</text>
    <text x="98" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Personnalisez chaque commande.</text>
    <path d="M282 575l4 4-4 4" fill="none" stroke="#7b86a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- About -->
    <g filter="url(#cardShadow)">
      <rect x="62" y="620" width="236" height="76" rx="16" fill="#ffffff" stroke="#d6deee"/>
    </g>
    <text x="76" y="642" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#c9a227">À PROPOS</text>
    <line x1="129" y1="639" x2="276" y2="639" stroke="#e8edf9"/>
    <path d="M280 636l4 4-4 4" fill="none" stroke="#7b86a6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="661" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#59658a">Presa est une télécommande locale et hors ligne.</text>
    <text x="76" y="680" font-family="Segoe UI, system-ui, sans-serif" font-size="7" fill="#7b86a6">Version 1.0.0 · Licence MIT</text>

    <rect x="148" y="708" width="64" height="4" rx="2" fill="#d6deee"/>
  </g>
</svg>
