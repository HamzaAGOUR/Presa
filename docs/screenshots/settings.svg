<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="Presa settings screen preview placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e8edf9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2a5c" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="360" height="760" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="42" y="24" width="276" height="712" rx="34" fill="#ffffff" stroke="#d6deee"/>
    <rect x="142" y="38" width="76" height="8" rx="4" fill="#e8edf9"/>
    <text x="62" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#7b86a6">← Retour</text>
    <text x="62" y="116" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#1f2a5c">Paramètres</text>

    <text x="62" y="154" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">APPARENCE</text>
    <rect x="62" y="164" width="236" height="66" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <text x="76" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#1f2a5c">Thème</text>
    <rect x="76" y="196" width="208" height="24" rx="7" fill="#ffffff" stroke="#d6deee"/>
    <rect x="79" y="199" width="67" height="18" rx="5" fill="#1f2a5c"/>
    <text x="112" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#ffffff">Système</text>
    <text x="168" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" fill="#59658a">Clair</text>
    <text x="244" y="211" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="7.5" fill="#59658a">Sombre</text>
    <text x="76" y="240" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#1f2a5c">Langue</text>
    <text x="284" y="240" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#59658a">Français ›</text>

    <text x="62" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">COMMANDES</text>
    <rect x="62" y="278" width="236" height="98" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <g font-family="Segoe UI, system-ui, sans-serif">
      <text x="76" y="299" font-size="9.5" font-weight="600" fill="#1f2a5c">Retour haptique</text>
      <rect x="260" y="288" width="24" height="14" rx="7" fill="#008a4b"/>
      <circle cx="277" cy="295" r="5" fill="#ffffff"/>
      <line x1="76" y1="312" x2="284" y2="312" stroke="#e8edf9"/>
      <text x="76" y="332" font-size="9.5" font-weight="600" fill="#1f2a5c">Volume = suivant / précédent</text>
      <rect x="260" y="321" width="24" height="14" rx="7" fill="#d6deee"/>
      <circle cx="267" cy="328" r="5" fill="#ffffff"/>
      <line x1="76" y1="345" x2="284" y2="345" stroke="#e8edf9"/>
      <text x="76" y="365" font-size="9.5" font-weight="600" fill="#1f2a5c">Vitesse de répétition</text>
      <text x="284" y="365" text-anchor="end" font-size="8.5" fill="#59658a">Normal ›</text>
    </g>

    <text x="62" y="404" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">MINUTEUR</text>
    <rect x="62" y="414" width="236" height="50" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <text x="76" y="435" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#1f2a5c">Alerte de fin de minuteur</text>
    <text x="76" y="451" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#7b86a6">Vibre après le nombre de minutes choisi.</text>
    <text x="284" y="440" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#1f2a5c">30 min</text>

    <text x="62" y="494" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">TOUCHES</text>
    <rect x="62" y="504" width="236" height="50" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <text x="76" y="525" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#1f2a5c">Remapper les touches</text>
    <text x="76" y="541" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#7b86a6">Personnalisez chaque commande.</text>
    <text x="284" y="531" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#59658a">3 ›</text>

    <text x="62" y="584" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700" fill="#1f2a5c">À PROPOS</text>
    <rect x="62" y="594" width="236" height="48" rx="10" fill="#f2f5fd" stroke="#d6deee"/>
    <text x="76" y="614" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#59658a">Presa est une télécommande locale et hors ligne.</text>
    <text x="76" y="629" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#7b86a6">Version 1.0.0 · Licence MIT</text>

    <text x="180" y="678" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#7b86a6">Aperçu de l’interface — capture à venir</text>
    <rect x="148" y="708" width="64" height="4" rx="2" fill="#d6deee"/>
  </g>
</svg>
