      <rect x="186" y="545" width="112" height="40" rx="10" fill="#131b38" stroke="#283357"/><text x="242" y="563" font-size="8.5" font-weight="600" fill="#eef1ff">Zoom arrière</text><text x="242" y="575" font-size="6.2" fill="#7f8ab0">Ctrl −</text>
      <rect x="62" y="592" width="112" height="40" rx="10" fill="#131b38" stroke="#283357"/><text x="118" y="610" font-size="8.5" font-weight="600" fill="#eef1ff">Panneaux</text><text x="118" y="622" font-size="6.2" fill="#7f8ab0">D</text>
      <rect x="186" y="592" width="112" height="40" rx="10" fill="#131b38" stroke="#283357"/><text x="242" y="610" font-size="8.5" font-weight="600" fill="#eef1ff">Présentation</text><text x="242" y="622" font-size="6.2" fill="#7f8ab0">P</text>
