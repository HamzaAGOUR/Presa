      <rect x="41" y="30.5" width="26" height="27" rx="7" fill="url(#screen)" stroke="#8c5c0d" stroke-width="0.7"/>
      <path d="M54,35 L45,43 M54,35 L63,43 M45,43 L38,51 M45,43 L50,51 M63,43 L58,51 M63,43 L70,51" fill="none" stroke="#152247" stroke-width="3" stroke-linecap="round"/>
      <path d="M54,35 L45,43 M54,35 L63,43 M45,43 L38,51 M45,43 L50,51 M63,43 L58,51 M63,43 L70,51" fill="none" stroke="#a3b8ff" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="#c2cfff" stroke="#142044" stroke-width="0.8">
        <circle cx="54" cy="35" r="2.5"/>
        <circle cx="45" cy="43" r="2.2"/>
        <circle cx="63" cy="43" r="2.2"/>
        <circle cx="38" cy="51" r="1.9"/>
        <circle cx="50" cy="51" r="1.9"/>
        <circle cx="58" cy="51" r="1.9"/>
        <circle cx="70" cy="51" r="1.9"/>
      </g>
      <circle cx="54" cy="67" r="4.2" fill="#14224a" stroke="#8c5c0d" stroke-width="0.8"/>
      <circle cx="54" cy="67" r="1.6" fill="#f6bd4e"/>
    </g>
