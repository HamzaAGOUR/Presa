      <rect x="143" y="424" width="74" height="42" rx="10" fill="#131b38" stroke="#283357"/><text x="180" y="443" font-size="8.5" font-weight="600" fill="#eef1ff">Début</text><text x="180" y="455" font-size="6.2" fill="#7f8ab0">Origine</text>
      <rect x="224" y="424" width="74" height="42" rx="10" fill="#131b38" stroke="#283357"/><text x="261" y="443" font-size="8.5" font-weight="600" fill="#eef1ff">Fin</text><text x="261" y="455" font-size="6.2" fill="#7f8ab0">Fin</text>
      <rect x="62" y="473" width="74" height="42" rx="10" fill="#131b38" stroke="#283357"/><text x="99" y="492" font-size="8.5" font-weight="600" fill="#eef1ff">Ralentir</text><text x="99" y="504" font-size="6.2" fill="#7f8ab0">−</text>
      <rect x="143" y="473" width="74" height="42" rx="10" fill="#131b38" stroke="#283357"/><text x="180" y="492" font-size="8.5" font-weight="600" fill="#eef1ff">Accélérer</text><text x="180" y="504" font-size="6.2" fill="#7f8ab0">+</text>
      <rect x="224" y="473" width="74" height="42" rx="10" fill="#131b38" stroke="#283357"/><text x="261" y="492" font-size="8.5" font-weight="600" fill="#eef1ff">Ajuster</text><text x="261" y="504" font-size="6.2" fill="#7f8ab0">0</text>
