<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-label="Presa main remote screen, dark theme">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0e142a"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#2f6fe4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2f6fe4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e20"/>
      <stop offset="1" stop-color="#1c2c5b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd985"/>
      <stop offset="0.5" stop-color="#f0b143"/>
      <stop offset="1" stop-color="#c57e0e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14224a"/>
      <stop offset="1" stop-color="#070d1e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
