    <text x="180" y="692" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="6.5" fill="#7f8ab0">Glissez pour déplacer le curseur</text>

    <rect x="148" y="708" width="64" height="4" rx="2" fill="#283357"/>
